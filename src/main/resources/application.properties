# MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Port where our web server runs (uses cloud PORT if available, or 8080 locally)
server.port=${PORT:8080}

# Automatically initialize schema (creates 'transactions' table if not exists)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
