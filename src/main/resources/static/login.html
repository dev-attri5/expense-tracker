<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Personal Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Header -->
    <nav class="navbar">
        <div class="container">
            <a href="login.html" class="brand">💰 Expense Tracker</a>
            <div class="nav-links">
                <a href="register.html">Register</a>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="auth-container">
        <!-- Alert Notification Box -->
        <div id="alert-box" class="alert"></div>

        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your username and password</p>

            <form id="login-form">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="e.g. dev123" required autofocus>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Log In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create one here</a>
            </div>
        </div>
    </div>

    <!-- JavaScript logic -->
    <script src="js/app.js"></script>
</body>
</html>
