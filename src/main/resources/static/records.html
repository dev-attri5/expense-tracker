<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker - All Records</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1. Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="brand">💰 Expense Tracker</a>
            <div class="nav-links" style="display: flex; align-items: center; gap: 8px;">
                <a href="index.html">Dashboard</a>
                <a href="records.html" class="active">All Records</a>
                <span id="user-greeting" style="font-weight: 600; color: #495057; margin-left: 10px;"></span>
                <button type="button" id="logout-btn" class="btn btn-secondary btn-sm" style="margin-left: 6px;">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">

        <!-- 2. Alert Notification (Success / Error) -->
        <div id="alert-box" class="alert"></div>

        <!-- 3. Search and Filter Bar Card -->
        <section class="card section-card">
            <h2>Search and Filter</h2>
            <form id="filter-form" class="filter-bar">
                <!-- Type Filter -->
                <div class="filter-group">
                    <label for="filter-type">Type</label>
                    <select id="filter-type">
                        <option value="ALL">All Types</option>
                        <option value="INCOME">Income Only</option>
                        <option value="EXPENSE">Expense Only</option>
                    </select>
                </div>

                <!-- Start Date -->
                <div class="filter-group">
                    <label for="filter-start-date">From Date</label>
                    <input type="date" id="filter-start-date">
                </div>

                <!-- End Date -->
                <div class="filter-group">
                    <label for="filter-end-date">To Date</label>
                    <input type="date" id="filter-end-date">
                </div>

                <!-- Action Buttons -->
                <div class="filter-group" style="display: flex; flex-direction: row; gap: 8px;">
                    <button type="submit" class="btn btn-primary">Filter</button>
                    <button type="button" id="clear-filters-btn" class="btn btn-secondary">Clear</button>
                </div>
            </form>
        </section>

        <!-- 4. All Records Table Card -->
        <section class="card section-card">
            <h2>All Records</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Note</th>
                            <th class="text-right">Amount</th>
                            <th style="width: 140px; text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="all-records-body">
                        <!-- Populated by JavaScript -->
                        <tr>
                            <td colspan="6" class="empty-message">Loading records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <!-- 5. Edit Modal Dialog (hidden by default) -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal">
            <h2>Edit Record</h2>
            <div id="modal-alert-box" class="alert"></div>
            <form id="edit-form">
                <input type="hidden" id="edit-id">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="edit-type">Type</label>
                        <select id="edit-type" required>
                            <option value="EXPENSE">Expense</option>
                            <option value="INCOME">Income</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="edit-amount">Amount (₹)</label>
                        <input type="number" id="edit-amount" step="0.01" min="0.01" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="edit-category">Category</label>
                        <select id="edit-category" required></select>
                    </div>

                    <div class="form-group full-width">
                        <label for="edit-date">Date</label>
                        <input type="date" id="edit-date" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="edit-note">Note</label>
                        <input type="text" id="edit-note">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript logic -->
    <script src="js/app.js"></script>
</body>
</html>
